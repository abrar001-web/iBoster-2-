    /* Ambient Floating Liquid Mesh Blobs */
    .liquid-backdrop {
      position: fixed;
      inset: 0;
      z-index: -1;
      overflow: hidden;
      pointer-events: none;
    }

    .liquid-blob {
      position: absolute;
      border-radius: 42% 58% 70% 30% / 45% 45% 55% 55%;
      filter: blur(72px);
      animation: liquidMorph 18s ease-in-out infinite alternate;
      transition: background 0.7s ease;
    }

    .liquid-blob-1 {
      width: 52vw;
      height: 52vw;
      max-width: 680px;
      max-height: 680px;
      top: -12%;
      left: -10%;
      background: var(--bg-grad-1);
    }

    .liquid-blob-2 {
      width: 48vw;
      height: 48vw;
      max-width: 620px;
      max-height: 620px;
      bottom: -14%;
      right: -8%;
      background: var(--bg-grad-2);
      animation-delay: -6s;
    }

    .liquid-blob-3 {
      width: 38vw;
      height: 38vw;
      max-width: 480px;
      max-height: 480px;
      top: 38%;
      left: 34%;
      background: var(--bg-grad-3);
      animation-delay: -11s;
    }

    @keyframes liquidMorph {
      0% {
        transform: translate3d(0, 0, 0) rotate(0deg) scale(1);
        border-radius: 42% 58% 70% 30% / 45% 45% 55% 55%;
      }
      50% {
        transform: translate3d(35px, -28px, 0) rotate(12deg) scale(1.08);
        border-radius: 62% 38% 46% 54% / 60% 36% 64% 40%;
      }
      100% {
        transform: translate3d(-25px, 30px, 0) rotate(-10deg) scale(0.96);
        border-radius: 36% 64% 52% 48% / 38% 62% 38% 62%;
      }
    }

    .rain-overlay {
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.6s ease;
      background-image: repeating-linear-gradient(
        105deg,
        transparent 0px,
        transparent 28px,
        rgba(125, 211, 252, 0.08) 29px,
        transparent 31px
      );
      background-size: 120px 120px;
      animation: rainFall 1.1s linear infinite;
    }

    body.weather-rainy .rain-overlay {
      opacity: 1;
    }

    @keyframes rainFall {
      from { background-position: 0 0; }
      to { background-position: -32px 120px; }
    }

    .liquid-glass {
      background: var(--glass-surface);
      backdrop-filter: blur(22px) saturate(185%);
      -webkit-backdrop-filter: blur(22px) saturate(185%);
      border: 1px solid var(--glass-border);
      box-shadow: var(--glass-shadow), inset 0 1px 0 0 var(--glass-specular);
      transition: background 0.3s ease, border-color 0.3s ease, transform 0.25s ease, box-shadow 0.3s ease;
    }

    .liquid-glass-strong {
      background: var(--glass-surface-strong);
      backdrop-filter: blur(28px) saturate(195%);
      -webkit-backdrop-filter: blur(28px) saturate(195%);
      border: 1px solid var(--glass-border);
      box-shadow: var(--glass-shadow), inset 0 1px 0 0 var(--glass-specular);
    }

    .liquid-card-interactive:hover {
      background: var(--glass-card-hover);
      transform: translateY(-2px);
    }

    .liquid-input {
      background: var(--input-bg);
      border: 1px solid var(--input-border);
      color: var(--text-primary);
      backdrop-filter: blur(12px);
    }

    .liquid-input:focus {
      outline: none;
      border-color: var(--accent-primary);
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.22);
    }

    .text-theme-primary { color: var(--text-primary); }
    .text-theme-secondary { color: var(--text-secondary); }
    .text-theme-muted { color: var(--text-muted); }

    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(148, 163, 184, 0.45); border-radius: 9999px; }

    @keyframes fadeSlideUp {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .animate-fade-up {
      animation: fadeSlideUp 0.24s ease-out forwards;
    }

    @keyframes ripplePulse {
      0% { opacity: 0; transform: scale(0.75); }
      35% { opacity: 1; transform: scale(1.06); }
      100% { opacity: 0; transform: scale(1.15); }
    }

    .animate-seek-ripple {
      animation: ripplePulse 0.65s ease-out forwards;
    }

    /* Locked Custom Video Player & Fullscreen Rendering (Point 16) */
    .custom-player-shell {
      position: relative;
      background: #020617;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }

    .player-click-shield {
      position: absolute;
      inset: 0;
      z-index: 20;
      pointer-events: auto;
      background: transparent;
      cursor: pointer;
    }

    .custom-player-shell.pseudo-fullscreen,

    .custom-player-shell:-webkit-full-screen {
      position: fixed !important;
      inset: 0 !important;
      z-index: 9999 !important;
      width: 100vw !important;
      height: 100dvh !important;
      max-width: none !important;
      max-height: none !important;
      border-radius: 0 !important;
      display: flex !important;
      flex-direction: column !important;
      justify-content: center !important;
      align-items: center !important;
      background: #000000 !important;
      overflow: hidden !important;
    }

    .custom-player-shell.is-fullscreen #player-orientation-wrapper,

    .custom-player-shell:-webkit-full-screen #player-orientation-wrapper {
      position: relative !important;
      width: 100vw !important;
      height: 100dvh !important;
      max-width: 100vw !important;
      max-height: 100dvh !important;
      padding: 0 !important;
      margin: 0 !important;
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
      background: #000000 !important;
      overflow: hidden !important;
    }

    .custom-player-shell.is-fullscreen .player-stage,
    .custom-player-shell:fullscreen .player-stage,
    .custom-player-shell:-webkit-full-screen .player-stage {
      position: relative !important;
      flex: none !important;
      padding-top: 0 !important;
      width: 100vw !important;
      height: 100dvh !important;
      max-width: 100vw !important;
      max-height: 100dvh !important;
      aspect-ratio: auto !important;
      border-radius: 0 !important;
      border: 0 !important;
      background: #000000 !important;
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
      overflow: hidden !important;
    }

    .custom-player-shell.is-fullscreen #media-embed-mount,
    .custom-player-shell:fullscreen #media-embed-mount,
    .custom-player-shell:-webkit-full-screen #media-embed-mount {
      position: relative !important;
      width: 100% !important;
      height: 100% !important;
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
      background: #000000 !important;
    }

    .custom-player-shell.is-fullscreen #media-embed-mount iframe,
    .custom-player-shell.is-fullscreen #media-embed-mount video,
    .custom-player-shell:fullscreen #media-embed-mount iframe,
    .custom-player-shell:fullscreen #media-embed-mount video,
    .custom-player-shell:-webkit-full-screen #media-embed-mount iframe,
    .custom-player-shell:-webkit-full-screen #media-embed-mount video {
      width: 100% !important;
      height: 100% !important;
      max-width: 100vw !important;
      max-height: 100dvh !important;
      object-fit: contain !important;
      background: #000000 !important;
    }

    /* Fullscreen Auto-Hide HUD State (Hidden on entry, shown on single tap, auto-hidden after 5s) */
    .custom-player-shell.is-fullscreen .fs-hud-bar {
      position: fixed !important;
      left: 0 !important;
      right: 0 !important;
      z-index: 40 !important;
      transition: opacity 0.28s ease, transform 0.28s ease !important;
    }

    .custom-player-shell.is-fullscreen .fs-top-hud {
      top: 0 !important;
    }

    .custom-player-shell.is-fullscreen .fs-bottom-hud {
      bottom: 0 !important;
    }

    .custom-player-shell.is-fullscreen.fs-controls-hidden .fs-hud-bar,
    .custom-player-shell.is-fullscreen.fs-controls-hidden #player-pause-overlay {
      opacity: 0 !important;
      pointer-events: none !important;
    }

    .custom-player-shell.is-fullscreen.fs-controls-hidden .fs-top-hud {
      transform: translateY(-100%) !important;
    }

    .custom-player-shell.is-fullscreen.fs-controls-hidden .fs-bottom-hud {
      transform: translateY(100%) !important;
    }

    .custom-player-shell.is-fullscreen:not(.fs-controls-hidden) .fs-hud-bar {
      opacity: 1 !important;
      pointer-events: auto !important;
      transform: translateY(0) !important;
    }

    .custom-player-shell.is-fullscreen:not(.fs-controls-hidden) #player-pause-overlay:not(.hidden) {
      opacity: 1 !important;
      pointer-events: auto !important;
    }

    /* Quality Profile Visual Filters */
    .quality-profile-medium { filter: contrast(0.96) saturate(0.92); }
    .quality-profile-large { filter: contrast(0.99) saturate(0.97); }
    .quality-profile-hd720 { filter: contrast(1.02) saturate(1.03); }

    input[type="range"].player-slider {

      cursor: pointer;
    }

    input[type="range"].player-slider::-webkit-slider-runnable-track {

      border: 2px solid #ffffff;
      margin-top: -4px;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.5);
    }

    function loadJSON(key, fallback) {
      try {
        const raw = localStorage.getItem(key);
        return raw ? JSON.parse(raw) : fallback;
      } catch (e) {
        return fallback;
      }
    }

    function saveJSON(key, value) {
      try {
        localStorage.setItem(key, JSON.stringify(value));
      } catch (e) {
        console.warn("Storage warning:", e);
      }
    }

    function escapeHtml(str) {
      if (str === null || str === undefined) return "";
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    // =========================================================================
    // 5. INDEXEDDB OFFLINE VAULT ENGINE (POINT 5)
    // =========================================================================
    const OFFLINE_DB_NAME = "iBosterOfflineVaultDB";
    const OFFLINE_STORE_NAME = "offline_media_blobs";

    function openOfflineVaultDB() {
      return new Promise((resolve, reject) => {
        if (!("indexedDB" in window)) {
          reject(new Error("IndexedDB unavailable"));
          return;
        }
        const req = indexedDB.open(OFFLINE_DB_NAME, 1);
        req.onupgradeneeded = (ev) => {
          const db = ev.target.result;
          if (!db.objectStoreNames.contains(OFFLINE_STORE_NAME)) {
            db.createObjectStore(OFFLINE_STORE_NAME, { keyPath: "id" });
          }
        };
        req.onsuccess = (ev) => resolve(ev.target.result);
        req.onerror = (ev) => reject(ev.target.error);
      });
    }

    async function saveMediaRecordToIndexedDB(record) {
      const db = await openOfflineVaultDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(OFFLINE_STORE_NAME, "readwrite");
        tx.objectStore(OFFLINE_STORE_NAME).put(record);
        tx.oncomplete = () => resolve(true);
        tx.onerror = () => reject(tx.error);
      });
    }

    async function getMediaRecordFromIndexedDB(lectureId) {
      const db = await openOfflineVaultDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(OFFLINE_STORE_NAME, "readonly");
        const req = tx.objectStore(OFFLINE_STORE_NAME).get(lectureId);
        req.onsuccess = () => resolve(req.result || null);
        req.onerror = () => reject(req.error);
      });
    }

    async function deleteMediaRecordFromIndexedDB(lectureId) {
      const db = await openOfflineVaultDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(OFFLINE_STORE_NAME, "readwrite");
        tx.objectStore(OFFLINE_STORE_NAME).delete(lectureId);
        tx.oncomplete = () => resolve(true);
        tx.onerror = () => reject(tx.error);
      });
    }

    function formatStorageSize(bytes) {
      const b = Number(bytes || 0);
      if (b >= 1024 * 1024) return `${(b / (1024 * 1024)).toFixed(2)} MB`;
      if (b >= 1024) return `${Math.round(b / 1024)} KB`;
      return `${b} B`;
    }

    async function downloadLectureForOffline(lectureId) {
      const lec = state.lectures.find((l) => l.id === lectureId);
      if (!lec) return;

      showToast(`"${lec.title}" অফলাইনে সেভ হচ্ছে...`, "info");

      let blobPayload = null;
      let mode = "offline_stream_pack";
      let sizeBytes = 420 * 1024;

      const parsed = parseMediaUrl(lec.videoUrl);
      const thumbUrl = parsed.type === "youtube" && parsed.videoId
        ? `https://img.youtube.com/vi/${parsed.videoId}/hqdefault.jpg`
        : "";

      if (thumbUrl) {
        try {
          const resp = await fetch(thumbUrl, { cache: "no-store" });
          if (resp.ok) {
            const imgBlob = await resp.blob();
            sizeBytes += imgBlob.size;
          }
        } catch (e) {}
      }

      if (/\.(mp4|webm|ogg)(\?.*)?$/i.test(lec.videoUrl)) {
        try {
          const vResp = await fetch(lec.videoUrl);
          if (vResp.ok) {
            blobPayload = await vResp.blob();
            mode = "direct_video_blob";
            sizeBytes = blobPayload.size;
          }
        } catch (e) {}
      }

      try {
        await saveMediaRecordToIndexedDB({
          id: lec.id,
          title: lec.title,
          folder: lec.folder,
          videoUrl: lec.videoUrl,
          pdfLink: lec.pdfLink || "",
          mode,
          blob: blobPayload,
          savedAt: new Date().toLocaleString("bn-BD", { dateStyle: "medium", timeStyle: "short" })
        });
      } catch (e) {}

      state.offlineMeta[lec.id] = {
        id: lec.id,
        title: lec.title,
        folder: lec.folder,
        videoUrl: lec.videoUrl,
        pdfLink: lec.pdfLink || "",
        mode,
        sizeBytes,
        savedAt: new Date().toLocaleString("bn-BD", { dateStyle: "medium", timeStyle: "short" })
      };
      persistAll();
      showToast(`"${lec.title}" অফলাইন স্টোরেজে সংরক্ষিত হয়েছে!`, "success");
      render();
    }

    async function deleteOfflineLecture(lectureId) {
      try {
        await deleteMediaRecordFromIndexedDB(lectureId);
      } catch (e) {}
      if (playerState.activeLectureId === lectureId && playerState.isOfflinePlayback) {
        destroyActivePlayer();
        if (state.activeView === "watch") state.activeView = "offline";
      }
      delete state.offlineMeta[lectureId];
      persistAll();
      showToast("অফলাইন ফাইলটি ডিলিট করা হয়েছে।", "info");
      render();
    }

    function getOfflineFolderPaths() {
      const items = Object.values(state.offlineMeta);
      const set = new Set();
      items.forEach((item) => {
        if (!item.folder) return;
        const parts = item.folder.split("/").map((p) => p.trim()).filter(Boolean);
        let acc = "";
        parts.forEach((p) => {
          acc = acc ? `${acc}/${p}` : p;
          set.add(acc);
        });
      });
      return Array.from(set).sort((a, b) => a.localeCompare(b));
    }

    function getOfflineChildFolders(parentPath) {
      const all = getOfflineFolderPaths();
      const children = new Set();
      const prefix = parentPath ? `${parentPath}/` : "";
      all.forEach((fp) => {
        if (!parentPath) {
          const top = fp.split("/")[0];
          if (top) children.add(top);
        } else if (fp.startsWith(prefix)) {
          const next = fp.slice(prefix.length).split("/")[0];
          if (next) children.add(`${parentPath}/${next}`);
        }
      });
      return Array.from(children);
    }

    function countOfflineLecturesInTree(folderPath) {
      const prefix = `${folderPath}/`;
      return Object.values(state.offlineMeta).filter(
        (item) => item.folder === folderPath || (item.folder && item.folder.startsWith(prefix))
      ).length;
    }

    function applyThemeClasses() {
      const body = document.body;
      body.classList.remove("theme-light", "theme-dark", "weather-sunny", "weather-rainy", "weather-cloudy", "weather-night");

      if (state.themeMode === "dark") {

      } else if (state.themeMode === "weather") {
        body.classList.add(`weather-${state.weatherCondition || "sunny"}`);
      } else {
        body.classList.add("theme-light");
      }

      document.title = `${state.branding.siteName} — Liquid Glass Learning Portal`;
    }

    async function fetchLiveWeatherAndAdapt(silent = true) {
      let lat = 22.3569;
      let lon = 91.7832;
      let locLabel = "Chattogram";

      try {
        if ("geolocation" in navigator) {
          const pos = await new Promise((resolve, reject) => {
            navigator.geolocation.getCurrentPosition(resolve, reject, { timeout: 3500 });
          });
          if (pos && pos.coords) {
            lat = pos.coords.latitude;
            lon = pos.coords.longitude;
            locLabel = "Local Sky";
          }
        }
      } catch (e) {}

      try {
        const res = await fetch(
          `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,weather_code,is_day`,
          { cache: "no-store" }
        );
        if (!res.ok) throw new Error("Weather fetch failed");
        const data = await res.json();
        const cur = data.current || {};
        const code = Number(cur.weather_code ?? 0);
        const isDay = Number(cur.is_day ?? 1) === 1;
        const temp = cur.temperature_2m !== undefined ? `${Math.round(cur.temperature_2m)}°C` : "28°C";

        let condition = "sunny";
        if ([51, 53, 55, 61, 63, 65, 80, 81, 82, 95, 96, 99].includes(code)) {
          condition = "rainy";
        } else if (!isDay) {
          condition = "night";
        } else if ([2, 3, 45, 48].includes(code)) {
          condition = "cloudy";
        } else {
          condition = "sunny";
        }

        state.weatherCondition = condition;
        state.weatherTemp = temp;
        state.weatherLocation = locLabel;
        persistAll();
        applyThemeClasses();
        if (state.themeMode === "weather") render();
        if (!silent) {
          showToast(`Weather Theme: ${condition.toUpperCase()} (${temp})`, "success");
        }
      } catch (err) {
        const hour = new Date().getHours();
        state.weatherCondition = hour >= 18 || hour < 6 ? "night" : "sunny";
        persistAll();
        applyThemeClasses();
      }
    }

    window.setThemeMode = (mode) => {
      state.themeMode = mode;
      persistAll();
      applyThemeClasses();
      if (mode === "weather") fetchLiveWeatherAndAdapt(false);

    // =========================================================================
    // 8. PER-USER WATCH PROGRESS & 98%–100% COMPLETED TRACKING
    // =========================================================================
    function getUserProgressBucket(userIdOverride = null) {
      const uid = userIdOverride || state.currentUser?.id || "guest";
      if (!state.watchProgressMap[uid]) {
        state.watchProgressMap[uid] = {};
      }
      return state.watchProgressMap[uid];
    }

    function getLectureProgress(lectureId, userIdOverride = null) {
      const bucket = getUserProgressBucket(userIdOverride);
      return (
        bucket[lectureId] || {
          percent: 0,
          currentTime: 0,
          duration: 0,
          completed: false
        }
      );
    }

    function recordLectureProgress(lectureId, currentTime, duration, forceComplete = false) {
      if (!lectureId) return;
      const bucket = getUserProgressBucket();
      const prev = getLectureProgress(lectureId);

      let pct = prev.percent || 0;
      if (forceComplete) {
        pct = 100;
      } else if (duration > 0) {
        const rawPct = Math.round((currentTime / duration) * 100);
        pct = Math.min(100, Math.max(prev.percent || 0, rawPct));
      }

      const isNowCompleted = forceComplete || prev.completed || pct >= 98;
      if (isNowCompleted && pct < 98) pct = 100;

      const justCompleted = !prev.completed && isNowCompleted;

      bucket[lectureId] = {
        percent: pct,
        currentTime: Number(currentTime) || prev.currentTime || 0,
        duration: Number(duration) || prev.duration || 0,
        completed: isNowCompleted
      };
      saveJSON(STORAGE_KEYS.PROGRESS, state.watchProgressMap);

      if (justCompleted) {
        showToast("ভিডিওটি ৯৮–১০০% দেখা সম্পন্ন হয়েছে (Completed ✓)", "success");
      }
      updateLiveWatchTrackerDom(lectureId);
    }

    function updateLiveWatchTrackerDom(lectureId) {
      if (playerState.activeLectureId !== lectureId) return;
      const prog = getLectureProgress(lectureId);

      const pctEl = document.getElementById("tracker-percent-text");
      const barEl = document.getElementById("tracker-progress-bar");
      const timeEl = document.getElementById("tracker-time-text");
      const statusEl = document.getElementById("tracker-status-badge");
      const playlistBadge = document.getElementById(`playlist-badge-${lectureId}`);
      const playlistBar = document.getElementById(`playlist-bar-${lectureId}`);

      if (pctEl) pctEl.textContent = `${prog.percent}%`;
      if (barEl) {
        barEl.style.width = `${prog.percent}%`;
        barEl.className = `h-full transition-all duration-300 ${prog.completed ? "bg-emerald-500" : "bg-indigo-500"}`;
      }
      if (timeEl) timeEl.textContent = `${formatTime(prog.currentTime)} / ${formatTime(prog.duration)}`;
      if (statusEl) {
        statusEl.innerHTML = prog.completed
          ? `<span class="inline-flex items-center gap-1 px-3 py-1 rounded-full bg-emerald-500/20 text-emerald-400 border border-emerald-400/40 text-xs font-bold"><i data-lucide="check-circle-2" class="w-3.5 h-3.5"></i> Completed</span>`
          : `<span class="inline-flex items-center gap-1 px-3 py-1 rounded-full bg-indigo-500/20 text-indigo-400 border border-indigo-400/40 text-xs font-bold">${prog.percent}%</span>`;
        lucide.createIcons();
      }
      if (playlistBadge && prog.completed) {
        playlistBadge.innerHTML = `<span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full bg-emerald-500/20 text-emerald-500 text-[10px] font-bold">✓ Completed</span>`;
      }
      if (playlistBar) playlistBar.style.width = `${prog.percent}%`;
    }

    // =========================================================================
    // 9. LOCKED CUSTOM VIDEO PLAYER & PORTRAIT FULLSCREEN AUTO-HIDE (POINT 16)
    // =========================================================================
    function computeEffectivePortraitState() {
      if (playerState.orientationMode === "portrait") return true;
      if (playerState.orientationMode === "landscape") return false;
      return window.matchMedia && window.matchMedia("(orientation: portrait)").matches && window.innerWidth < 768;
    }

    window.addEventListener("resize", () => {
      if (playerState.orientationMode === "auto" && playerState.activeLectureId && !playerState.isMini) {
        const nextPortrait = computeEffectivePortraitState();
        if (nextPortrait !== playerState.isPortraitActive) {
          playerState.isPortraitActive = nextPortrait;
          applyStageOrientationClasses();
        }
      }
      if (playerState.isFullscreenActive) {
        syncFullscreenShellClasses();
      }
    });

    window.addEventListener("orientationchange", () => {
      setTimeout(() => {
        if (playerState.orientationMode === "auto" && playerState.activeLectureId && !playerState.isMini) {
          playerState.isPortraitActive = computeEffectivePortraitState();
          applyStageOrientationClasses();
        }
        if (playerState.isFullscreenActive) {
          syncFullscreenShellClasses();
        }
      }, 120);
    });

    function clearFullscreenAutoHideTimer() {
      if (playerState.fsAutoHideTimer) {
        clearTimeout(playerState.fsAutoHideTimer);
        playerState.fsAutoHideTimer = null;
      }
    }

    function scheduleFullscreenAutoHide(delayMs = 5000) {
      clearFullscreenAutoHideTimer();
      if (!playerState.isFullscreenActive) return;
      playerState.fsAutoHideTimer = setTimeout(() => {
        playerState.fsControlsVisible = false;
        syncFullscreenShellClasses();
      }, delayMs);
    }

    function revealFullscreenControlsFor5Sec() {
      if (!playerState.isFullscreenActive) return;
      playerState.fsControlsVisible = true;
      syncFullscreenShellClasses();
      scheduleFullscreenAutoHide(5000);
    }

    function syncFullscreenShellClasses() {
      const shell = document.getElementById("custom-player-shell");
      if (!shell) return;
      const nativeFsEl = document.fullscreenElement || document.webkitFullscreenElement || null;
      const isNativeOnShell = Boolean(nativeFsEl && (nativeFsEl === shell || shell.contains(nativeFsEl)));
      const isPseudoFs = shell.classList.contains("pseudo-fullscreen");
      const active = Boolean(isNativeOnShell || isPseudoFs || playerState.isFullscreenActive);

      playerState.isFullscreenActive = active;
      shell.classList.toggle("is-fullscreen", active);

      if (active) {
        shell.classList.toggle("fs-controls-hidden", !playerState.fsControlsVisible);
      } else {
        clearFullscreenAutoHideTimer();
        playerState.fsControlsVisible = false;
        shell.classList.remove("fs-controls-hidden");
      }
    }

    function handleNativeFullscreenChange() {
      const shell = document.getElementById("custom-player-shell");
      const nativeFsEl = document.fullscreenElement || document.webkitFullscreenElement || null;
      const enteredNative = Boolean(shell && nativeFsEl && (nativeFsEl === shell || shell.contains(nativeFsEl)));

      if (enteredNative) {
        playerState.isFullscreenActive = true;
        playerState.fsControlsVisible = false;
        clearFullscreenAutoHideTimer();
        syncFullscreenShellClasses();
      } else if (!shell || !shell.classList.contains("pseudo-fullscreen")) {
        playerState.isFullscreenActive = false;
        playerState.fsControlsVisible = false;
        clearFullscreenAutoHideTimer();
        syncFullscreenShellClasses();
      }
    }

    document.addEventListener("fullscreenchange", handleNativeFullscreenChange);
    document.addEventListener("webkitfullscreenchange", handleNativeFullscreenChange);

    function applyStageOrientationClasses() {
      const stageWrap = document.getElementById("player-orientation-wrapper");
      const stageEl = document.getElementById("player-stage");
      const badgeEl = document.getElementById("orientation-mode-label");

      if (badgeEl) {
        const modeMap = { auto: "Auto", landscape: "Landscape", portrait: "Portrait" };
        badgeEl.textContent = modeMap[playerState.orientationMode] || "Auto";

        stageEl.className = "player-stage relative w-full max-w-[360px] aspect-[9/16] bg-black overflow-hidden rounded-2xl border border-slate-800 shadow-xl";
      } else {
        stageWrap.className = "bg-black w-full";
        stageEl.className = "player-stage relative w-full pt-[56.25%] bg-black overflow-hidden";
      }
    }

    function parseMediaUrl(rawUrl) {
      const url = (rawUrl || "").trim();
      if (!url) return { type: "unknown", cleanUrl: "" };

      const ytRegex = /(?:youtube\.com\/(?:watch\?(?:.*&)?v=|embed\/|v\/|shorts\/|live\/)|youtu\.be\/)([a-zA-Z0-9_-]{11})/;
      const ytMatch = url.match(ytRegex);
      if (ytMatch && ytMatch[1]) {
        return {
          type: "youtube",
          videoId: ytMatch[1],
          cleanUrl: `https://www.youtube-nocookie.com/embed/${ytMatch[1]}`
        };
      }

      if (/facebook\.com|fb\.watch/i.test(url)) {
        const normalizedFb = url.startsWith("http") ? url : `https://${url}`;
        return { type: "facebook", videoId: null, cleanUrl: normalizedFb };
      }

      return { type: "unknown", cleanUrl: url };
    }

    function extractGoogleDriveFileId(url) {
      if (!url) return null;
      const match = url.match(/\/d\/([a-zA-Z0-9_-]+)/) || url.match(/[?&]id=([a-zA-Z0-9_-]+)/);
      return match ? match[1] : null;
    }

    function extractGoogleSheetId(url) {
      if (!url) return null;
      const match = url.match(/\/spreadsheets\/d\/([a-zA-Z0-9-_]+)/);
      return match ? match[1] : null;
    }

    function formatTime(seconds) {
      const s = Math.max(0, Math.floor(Number(seconds) || 0));
      const hrs = Math.floor(s / 3600);
      const mins = Math.floor((s % 3600) / 60);
      const secs = s % 60;
      if (hrs > 0) return `${hrs}:${String(mins).padStart(2, "0")}:${String(secs).padStart(2, "0")}`;
      return `${String(mins).padStart(2, "0")}:${String(secs).padStart(2, "0")}`;
    }

    function stopPlayerTimers() {
      if (playerState.progressTimer) {
        clearInterval(playerState.progressTimer);
        playerState.progressTimer = null;
      }
      if (playerState.turboRafId) {
        cancelAnimationFrame(playerState.turboRafId);
        playerState.turboRafId = null;
      }
    }

    function destroyActivePlayer() {
      clearFullscreenAutoHideTimer();
      playerState.isFullscreenActive = false;
      playerState.fsControlsVisible = false;
      stopPlayerTimers();
      if (playerState.ytPlayer && typeof playerState.ytPlayer.destroy === "function") {
        try { playerState.ytPlayer.destroy(); } catch (e) {}
      }
      playerState.ytPlayer = null;
      playerState.htmlVideoEl = null;
      if (playerState.blobObjectUrl) {
        try { URL.revokeObjectURL(playerState.blobObjectUrl); } catch (e) {}
        playerState.blobObjectUrl = null;
      }
      playerState.activeLectureId = null;
      playerState.isMini = false;
      playerState.isOfflinePlayback = false;

      const miniDock = document.getElementById("mini-player-dock");
      if (miniDock) miniDock.innerHTML = "";
    }

    async function openLectureOnWatchPage(lectureId, startTimeOverride = null, fromOfflineVault = false) {
      const lec = state.lectures.find((l) => l.id === lectureId) || state.offlineMeta[lectureId];
      if (!lec) return;

      const blocking = findBlockingLock(lec.folder);
      if (blocking) {
        openPinVerificationModal(blocking.lockedPath, blocking.pin, () => {
          openLectureOnWatchPage(lectureId, startTimeOverride, fromOfflineVault);
        });
        return;
      }

      const parsed = parseMediaUrl(lec.videoUrl);
      let blobUrl = null;
      let isOfflineBlob = false;

      if (fromOfflineVault || state.offlineMeta[lectureId]) {
        try {
          const rec = await getMediaRecordFromIndexedDB(lectureId);
          if (rec && rec.blob) {
            blobUrl = URL.createObjectURL(rec.blob);
            isOfflineBlob = true;
          }
        } catch (e) {}
      }

      if (!isOfflineBlob && parsed.type === "unknown") {
        showToast("Invalid Video URL", "error");
        return;
      }

      stopPlayerTimers();
      if (playerState.ytPlayer && typeof playerState.ytPlayer.destroy === "function") {
        try { playerState.ytPlayer.destroy(); } catch (e) {}
      }
      playerState.ytPlayer = null;
      playerState.htmlVideoEl = null;
      if (playerState.blobObjectUrl) {
        try { URL.revokeObjectURL(playerState.blobObjectUrl); } catch (e) {}
        playerState.blobObjectUrl = null;
      }

      const savedProg = getLectureProgress(lec.id);
      const resumeSec =
        startTimeOverride !== null
          ? startTimeOverride
          : !savedProg.completed && savedProg.currentTime > 3
          ? savedProg.currentTime
          : 0;

      playerState.activeLectureId = lec.id;
      playerState.title = lec.title;
      playerState.folder = lec.folder;
      playerState.pdfLink = lec.pdfLink || "";
      playerState.type = isOfflineBlob ? "offline_blob" : parsed.type;
      playerState.videoId = parsed.videoId;
      playerState.cleanUrl = parsed.cleanUrl;
      playerState.blobObjectUrl = blobUrl;
      playerState.isOfflinePlayback = Boolean(fromOfflineVault || state.offlineMeta[lec.id]);
      playerState.isPlaying = true;
      playerState.isMini = false;
      playerState.currentTime = resumeSec;
      playerState.duration = savedProg.duration || 0;
      playerState.isPortraitActive = computeEffectivePortraitState();

      const miniDock = document.getElementById("mini-player-dock");
      if (miniDock) miniDock.innerHTML = "";

      state.activeView = "watch";
      render();
      window.scrollTo({ top: 0, behavior: "smooth" });

      setTimeout(() => mountActivePlayerEmbed(resumeSec), 60);
    }

    function applyQualityVisualProfile(qualityKey) {
      const mount = document.getElementById("media-embed-mount");
      if (!mount) return;
      mount.classList.remove("quality-profile-medium", "quality-profile-large", "quality-profile-hd720", "quality-profile-hd1080");
      if (qualityKey && qualityKey !== "default") {
        mount.classList.add(`quality-profile-${qualityKey}`);
      }
    }

    function mountActivePlayerEmbed(startSeconds = 0) {
      const mount = document.getElementById("media-embed-mount");
      if (!mount || !playerState.activeLectureId) return;
      applyQualityVisualProfile(playerState.quality);

      if (playerState.type === "offline_blob" && playerState.blobObjectUrl) {
        mount.innerHTML = `
          <video
            id="offline-html5-video"
            src="${escapeHtml(playerState.blobObjectUrl)}"
            class="w-full h-full object-contain bg-black pointer-events-none"
            playsinline
            autoplay
          ></video>
        `;
        const vid = document.getElementById("offline-html5-video");
        playerState.htmlVideoEl = vid;
        if (vid) {
          vid.volume = playerState.isMuted ? 0 : playerState.volume / 100;
          vid.playbackRate = Math.min(4, Math.max(0.5, playerState.playbackRate));
          vid.addEventListener("loadedmetadata", () => {
            if (startSeconds > 0 && vid.duration > startSeconds) vid.currentTime = startSeconds;
            playerState.duration = vid.duration || 0;
          });
          vid.addEventListener("ended", () => {
            recordLectureProgress(playerState.activeLectureId, vid.duration || 100, vid.duration || 100, true);
          });
          startHtml5ProgressLoop();
        }
        return;
      }

      if (playerState.type === "youtube") {
        const startParam = Math.floor(startSeconds);
        const embedSrc = `https://www.youtube-nocookie.com/embed/${encodeURIComponent(playerState.videoId)}?enablejsapi=1&controls=0&rel=0&modestbranding=1&iv_load_policy=3&disablekb=1&fs=0&playsinline=1&autoplay=1&start=${startParam}`;

        mount.innerHTML = `
          <iframe
            id="yt-locked-iframe"
            class="w-full h-full border-0 pointer-events-none"
            src="${embedSrc}"
            sandbox="allow-scripts allow-same-origin allow-presentation"
            allow="autoplay; encrypted-media; fullscreen"
            referrerpolicy="strict-origin-when-cross-origin"
          ></iframe>
        `;

        if (window.YT && window.YT.Player) {
          try {
            playerState.ytPlayer = new YT.Player("yt-locked-iframe", {
              events: {
                onReady: (event) => {
                  event.target.setVolume(playerState.volume);
                  if (playerState.isMuted) event.target.mute();
                  if (playerState.quality !== "default" && event.target.setPlaybackQuality) {
                    event.target.setPlaybackQuality(playerState.quality);
                  }
                  applyPlaybackSpeedEngine(playerState.playbackRate);
                  event.target.playVideo();
                  startYouTubeProgressLoop();
                },
                onStateChange: (event) => {
                  const overlay = document.getElementById("player-pause-overlay");
                  const msg = document.getElementById("pause-overlay-msg");

                  if (event.data === YT.PlayerState.PLAYING) {
                    playerState.isPlaying = true;
                    playerState.duration = event.target.getDuration() || playerState.duration;
                    if (overlay) overlay.classList.add("hidden");
                    updatePlayPauseIcons(true);
                    if (playerState.playbackRate > 2) startTurboSpeedLoop();
                  } else if (event.data === YT.PlayerState.PAUSED) {
                    playerState.isPlaying = false;
                    if (msg) msg.textContent = "Paused — Click Play to resume inside " + state.branding.siteName;
                    if (overlay) overlay.classList.remove("hidden");
                    updatePlayPauseIcons(false);
                  } else if (event.data === YT.PlayerState.ENDED) {
                    playerState.isPlaying = false;
                    if (msg) msg.textContent = "Completed ✓ — Click Play to replay";
                    if (overlay) overlay.classList.remove("hidden");
                    updatePlayPauseIcons(false);
                    if (playerState.activeLectureId) {
                      recordLectureProgress(playerState.activeLectureId, playerState.duration, playerState.duration, true);
                    }
                  }
                }
              }
            });
          } catch (err) {}
        }
      } else if (playerState.type === "facebook") {
        const fbSrc = `https://www.facebook.com/plugins/video.php?href=${encodeURIComponent(playerState.cleanUrl)}&show_text=false&autoplay=true`;
        mount.innerHTML = `
          <iframe
            id="fb-locked-iframe"
            class="w-full h-full border-0"
            src="${fbSrc}"
            sandbox="allow-scripts allow-same-origin allow-presentation"
            allow="autoplay; encrypted-media; fullscreen"
            scrolling="no"
          ></iframe>
        `;
        if (playerState.activeLectureId) {
          const prev = getLectureProgress(playerState.activeLectureId);
          if (prev.percent === 0) recordLectureProgress(playerState.activeLectureId, 10, 100, false);
        }
      }
    }

    function applyPlaybackSpeedEngine(rate) {
      playerState.playbackRate = Number(rate);
      if (playerState.turboRafId) {
        cancelAnimationFrame(playerState.turboRafId);
        playerState.turboRafId = null;
      }
      if (playerState.htmlVideoEl) {
        playerState.htmlVideoEl.playbackRate = Math.min(4, Math.max(0.5, playerState.playbackRate));
        return;
      }
      const p = playerState.ytPlayer;
      if (p && typeof p.setPlaybackRate === "function") {
        p.setPlaybackRate(Math.min(2, playerState.playbackRate));
      }
      if (playerState.playbackRate > 2 && playerState.isPlaying) {
        startTurboSpeedLoop();
      }
    }

    function startTurboSpeedLoop() {
      if (playerState.turboRafId) cancelAnimationFrame(playerState.turboRafId);
      playerState.turboLastTs = performance.now();
      playerState.turboSeekAccumulator = 0;

      const step = (now) => {
        if (!playerState.isPlaying || playerState.playbackRate <= 2 || !playerState.ytPlayer) {
          playerState.turboRafId = null;
          return;
        }
        const dt = Math.min(0.25, (now - playerState.turboLastTs) / 1000);
        playerState.turboLastTs = now;
        playerState.turboSeekAccumulator += dt * (playerState.playbackRate - 2.0);

        if (playerState.turboSeekAccumulator >= 0.14) {
          const p = playerState.ytPlayer;
          if (p && typeof p.getCurrentTime === "function" && typeof p.seekTo === "function") {
            const cur = p.getCurrentTime() || 0;
            const dur = p.getDuration() || 0;
            const nextPos = cur + playerState.turboSeekAccumulator;
            if (dur > 0 && nextPos >= dur - 0.3) p.seekTo(dur, true);
            else p.seekTo(nextPos, true);
          }
          playerState.turboSeekAccumulator = 0;
        }
        playerState.turboRafId = requestAnimationFrame(step);
      };
      playerState.turboRafId = requestAnimationFrame(step);
    }

    function syncProgressBarDom(cur, dur) {
      playerState.currentTime = cur;
      playerState.duration = dur;
      const curEl = document.getElementById("player-time-current");
      const totEl = document.getElementById("player-time-total");
      const slider = document.getElementById("player-seek-slider");
      const fill = document.getElementById("player-progress-fill");
      if (curEl) curEl.textContent = formatTime(cur);
      if (totEl) totEl.textContent = formatTime(dur);
      const pct = dur > 0 ? Math.min(100, (cur / dur) * 100) : 0;
      if (slider) slider.value = pct;
      if (fill) fill.style.width = `${pct}%`;
      if (playerState.activeLectureId && dur > 0) {
        recordLectureProgress(playerState.activeLectureId, cur, dur, false);
      }
    }

    function startYouTubeProgressLoop() {
      if (playerState.progressTimer) clearInterval(playerState.progressTimer);
      playerState.progressTimer = setInterval(() => {
        const p = playerState.ytPlayer;
        if (!p || typeof p.getCurrentTime !== "function") return;
        syncProgressBarDom(p.getCurrentTime() || 0, p.getDuration() || 0);
      }, 500);
    }

    function startHtml5ProgressLoop() {
      if (playerState.progressTimer) clearInterval(playerState.progressTimer);
      playerState.progressTimer = setInterval(() => {
        const v = playerState.htmlVideoEl;
        if (!v) return;
        syncProgressBarDom(v.currentTime || 0, v.duration || 0);
      }, 500);
    }

    function updatePlayPauseIcons(isPlaying) {
      const mainBtn = document.getElementById("btn-play-pause");
      if (mainBtn) {
        mainBtn.innerHTML = isPlaying
          ? `<i data-lucide="pause" class="w-4 h-4"></i><span>Pause</span>`
          : `<i data-lucide="play" class="w-4 h-4 fill-current"></i><span>Play</span>`;
      }
      const miniBtn = document.getElementById("mini-btn-play-pause");
      if (miniBtn) {
        miniBtn.innerHTML = isPlaying
          ? `<i data-lucide="pause" class="w-4 h-4"></i>`
          : `<i data-lucide="play" class="w-4 h-4 fill-current"></i>`;
      }
      lucide.createIcons();
    }

    let tapSingleTimer = null;
    let lastTapTimestamp = 0;

    function triggerSeekRippleFeedback(direction) {
      const rippleEl = document.getElementById(direction === "back" ? "seek-ripple-left" : "seek-ripple-right");
      if (!rippleEl) return;
      rippleEl.classList.remove("hidden", "animate-seek-ripple");
      void rippleEl.offsetWidth;
      rippleEl.classList.add("animate-seek-ripple");
      setTimeout(() => rippleEl.classList.add("hidden"), 650);
    }

    window.handleScreenPointerTap = (event) => {
      if (playerState.type !== "youtube" && playerState.type !== "offline_blob") return;
      const shield = event.currentTarget;
      const rect = shield.getBoundingClientRect();
      const clientX = event.clientX !== undefined ? event.clientX : rect.left + rect.width / 2;
      const now = Date.now();
      const delta = now - lastTapTimestamp;

      if (delta > 0 && delta < 290) {
        if (tapSingleTimer) { clearTimeout(tapSingleTimer); tapSingleTimer = null; }
        lastTapTimestamp = 0;
        const isLeftHalf = clientX - rect.left < rect.width / 2;
        if (isLeftHalf) { window.seekRelative(-10); triggerSeekRippleFeedback("back"); }
        else { window.seekRelative(10); triggerSeekRippleFeedback("forward"); }
        if (playerState.isFullscreenActive) {
          scheduleFullscreenAutoHide(5000);
        }
      } else {
        lastTapTimestamp = now;
        tapSingleTimer = setTimeout(() => {
          tapSingleTimer = null;
          if (playerState.isFullscreenActive) {
            if (playerState.fsControlsVisible) {
              clearFullscreenAutoHideTimer();
              playerState.fsControlsVisible = false;
              syncFullscreenShellClasses();
            } else {
              revealFullscreenControlsFor5Sec();
            }
          } else {
            window.toggleCustomPlayPause();
          }
        }, 250);
      }
    };

    window.toggleCustomPlayPause = () => {
      const overlay = document.getElementById("player-pause-overlay");
      if (playerState.htmlVideoEl) {
        if (!playerState.htmlVideoEl.paused) {
          playerState.htmlVideoEl.pause();
          playerState.isPlaying = false;
          if (overlay) overlay.classList.remove("hidden");
          updatePlayPauseIcons(false);
        } else {
          playerState.htmlVideoEl.play().catch(() => {});
          playerState.isPlaying = true;
          if (overlay) overlay.classList.add("hidden");
          updatePlayPauseIcons(true);
        }
        return;
      }
      if (playerState.type !== "youtube") return;
      const p = playerState.ytPlayer;
      if (playerState.isPlaying) {
        if (p && p.pauseVideo) p.pauseVideo();
        playerState.isPlaying = false;
        if (overlay) overlay.classList.remove("hidden");
        updatePlayPauseIcons(false);
      } else {
        if (p && p.playVideo) p.playVideo();
        playerState.isPlaying = true;
        if (overlay) overlay.classList.add("hidden");
        updatePlayPauseIcons(true);
        if (playerState.playbackRate > 2) startTurboSpeedLoop();
      }
      if (playerState.isFullscreenActive) {
        scheduleFullscreenAutoHide(5000);
      }
    };

    window.seekRelative = (deltaSec) => {
      if (playerState.htmlVideoEl) {
        const v = playerState.htmlVideoEl;
        const dur = v.duration || 0;
        v.currentTime = Math.max(0, dur > 0 ? Math.min(dur, (v.currentTime || 0) + deltaSec) : (v.currentTime || 0) + deltaSec);
        return;
      }
      if (playerState.type !== "youtube") return;
      const p = playerState.ytPlayer;
      if (p && p.getCurrentTime && p.seekTo) {
        const cur = p.getCurrentTime() || 0;
        const dur = p.getDuration() || 0;
        const target = Math.max(0, dur > 0 ? Math.min(dur, cur + deltaSec) : cur + deltaSec);
        p.seekTo(target, true);
        syncProgressBarDom(target, dur);
      }
      if (playerState.isFullscreenActive) {
        scheduleFullscreenAutoHide(5000);
      }
    };

    window.handleCustomSeek = (pctVal) => {
      const dur = playerState.duration || (playerState.htmlVideoEl?.duration) || (playerState.ytPlayer?.getDuration ? playerState.ytPlayer.getDuration() : 0);
      if (dur <= 0) return;
      const target = (Number(pctVal) / 100) * dur;
      if (playerState.htmlVideoEl) playerState.htmlVideoEl.currentTime = target;
      else if (playerState.ytPlayer && playerState.ytPlayer.seekTo) playerState.ytPlayer.seekTo(target, true);
      syncProgressBarDom(target, dur);
      if (playerState.isFullscreenActive) {
        scheduleFullscreenAutoHide(5000);
      }
    };

    window.toggleCustomMute = () => {
      const btn = document.getElementById("btn-mute-toggle");
      playerState.isMuted = !playerState.isMuted;
      if (playerState.htmlVideoEl) {
        playerState.htmlVideoEl.muted = playerState.isMuted;
      } else if (playerState.ytPlayer) {
        if (playerState.isMuted) playerState.ytPlayer.mute();
        else playerState.ytPlayer.unMute();
      }
      if (btn) {
        btn.innerHTML = playerState.isMuted
          ? `<i data-lucide="volume-x" class="w-4 h-4 text-rose-400"></i>`
          : `<i data-lucide="volume-2" class="w-4 h-4"></i>`;
        lucide.createIcons();
      }
      if (playerState.isFullscreenActive) {
        scheduleFullscreenAutoHide(5000);
      }
    };

    window.handleCustomVolume = (val) => {
      const vol = Number(val);
      playerState.volume = vol;
      if (playerState.htmlVideoEl) {
        playerState.htmlVideoEl.volume = vol / 100;
        playerState.htmlVideoEl.muted = vol === 0;
      } else if (playerState.ytPlayer && playerState.ytPlayer.setVolume) {
        playerState.ytPlayer.setVolume(vol);
        if (vol > 0 && playerState.isMuted) {
          playerState.isMuted = false;
          playerState.ytPlayer.unMute();
        }
      }
      if (playerState.isFullscreenActive) {
        scheduleFullscreenAutoHide(5000);
      }
    };

    window.handleCustomSpeed = (rateStr) => {
      const rate = Number(rateStr);
      applyPlaybackSpeedEngine(rate);
      showToast(`Speed: ${rate}x`, "info");
      if (playerState.isFullscreenActive) {
        scheduleFullscreenAutoHide(5000);
      }
    };

    window.handleCustomQuality = (qualityKey) => {
      playerState.quality = qualityKey;
      const labelMap = { default: "Auto", medium: "360p", large: "480p", hd720: "720p", hd1080: "1080p" };
      applyQualityVisualProfile(qualityKey);
      const p = playerState.ytPlayer;
      if (p) {
        if (typeof p.setPlaybackQuality === "function") p.setPlaybackQuality(qualityKey);
        if (typeof p.setPlaybackQualityRange === "function" && qualityKey !== "default") {
          p.setPlaybackQualityRange(qualityKey, qualityKey);
        }
      }
      const badge = document.getElementById("active-quality-badge");
      if (badge) badge.textContent = labelMap[qualityKey] || "Auto";
      showToast(`Quality: ${labelMap[qualityKey] || "Auto"}`, "info");
      if (playerState.isFullscreenActive) {
        scheduleFullscreenAutoHide(5000);
      }
    };

    window.cycleOrientationMode = () => {
      const order = ["auto", "landscape", "portrait"];
      const nextIdx = (order.indexOf(playerState.orientationMode) + 1) % order.length;
      playerState.orientationMode = order[nextIdx];
      playerState.isPortraitActive = computeEffectivePortraitState();
      applyStageOrientationClasses();
      if (playerState.isFullscreenActive) {
        scheduleFullscreenAutoHide(5000);
      }
    };

    window.toggleFullscreenPlayer = () => {
      const shell = document.getElementById("custom-player-shell");
      if (!shell) return;
      const nativeFsEl = document.fullscreenElement || document.webkitFullscreenElement || null;
      const isCurrentlyFs = Boolean(nativeFsEl || shell.classList.contains("pseudo-fullscreen") || playerState.isFullscreenActive);

      if (isCurrentlyFs) {
        playerState.isFullscreenActive = false;
        playerState.fsControlsVisible = false;
        clearFullscreenAutoHideTimer();
        if (nativeFsEl) {
          const exitFn = document.exitFullscreen || document.webkitExitFullscreen;
          if (exitFn) exitFn.call(document).catch(() => {});
        }
        shell.classList.remove("pseudo-fullscreen", "is-fullscreen", "fs-controls-hidden");
        applyStageOrientationClasses();
        return;
      }

      // Enter fullscreen cleanly with HUD hidden initially
      playerState.isFullscreenActive = true;
      playerState.fsControlsVisible = false;
      clearFullscreenAutoHideTimer();
      shell.classList.add("is-fullscreen", "fs-controls-hidden");
      applyStageOrientationClasses();

      const reqFs = shell.requestFullscreen || shell.webkitRequestFullscreen;
      if (reqFs) {
        try {
          const prom = reqFs.call(shell);
          if (prom && typeof prom.catch === "function") {
            prom.catch(() => {
              shell.classList.add("pseudo-fullscreen");
              syncFullscreenShellClasses();
            });
          }
        } catch (err) {
          shell.classList.add("pseudo-fullscreen");
          syncFullscreenShellClasses();
        }
      } else {
        shell.classList.add("pseudo-fullscreen");
        syncFullscreenShellClasses();
      }
    };

    window.temporarilyUnlockFbCenterPlay = () => {
      const shield = document.getElementById("player-click-shield");
      if (!shield) return;
      shield.style.clipPath =
        "polygon(0% 0%, 0% 100%, calc(50% - 48px) 100%, calc(50% - 48px) calc(50% - 48px), calc(50% + 48px) calc(50% - 48px), calc(50% + 48px) calc(50% + 48px), calc(50% - 48px) calc(50% + 48px), calc(50% - 48px) 100%, 100% 100%, 100% 0%)";
      setTimeout(() => { if (shield) shield.style.clipPath = ""; }, 3200);
    };

    window.markCurrentLectureCompleted = () => {
      if (!playerState.activeLectureId) return;
      const dur = playerState.duration || 100;
      recordLectureProgress(playerState.activeLectureId, dur, dur, true);
      render();
    };

    // Mini Pop-up View
    window.enterMiniPopupView = () => {
      if (!playerState.activeLectureId) return;
      clearFullscreenAutoHideTimer();
      playerState.isFullscreenActive = false;
      playerState.fsControlsVisible = false;
      const resumeSec = playerState.currentTime || 0;
      const wasOffline = playerState.isOfflinePlayback;
      stopPlayerTimers();
      if (playerState.ytPlayer && typeof playerState.ytPlayer.destroy === "function") {
        try { playerState.ytPlayer.destroy(); } catch (e) {}
      }
      playerState.ytPlayer = null;
      playerState.htmlVideoEl = null;
      playerState.isMini = true;

      state.activeView = wasOffline ? "offline" : "portal";
      render();
      renderMiniPopupDock();
      setTimeout(() => mountActivePlayerEmbed(resumeSec), 60);
    };

    window.expandMiniPopupToWatchPage = () => {
      if (!playerState.activeLectureId) return;
      openLectureOnWatchPage(playerState.activeLectureId, playerState.currentTime || 0, playerState.isOfflinePlayback);
    };

    window.closeMiniPopupPlayer = () => {
      destroyActivePlayer();
    };

    function renderMiniPopupDock() {
      const dock = document.getElementById("mini-player-dock");
      if (!dock) return;
      if (!playerState.isMini || !playerState.activeLectureId) {
        dock.innerHTML = "";
        return;
      }

      dock.innerHTML = `
        <div
          id="mini-popup-card"
          oncontextmenu="return false;"
          style="right: ${playerState.miniPos.right}px; bottom: ${playerState.miniPos.bottom}px;"
          class="fixed z-50 w-72 sm:w-88 bg-slate-950/90 backdrop-blur-2xl border border-indigo-400/50 rounded-2xl shadow-2xl overflow-hidden animate-fade-up"
        >
          <div id="mini-popup-drag-handle" class="bg-slate-900/90 px-3 py-2 flex items-center justify-between gap-2 cursor-move select-none border-b border-white/10">
            <div class="flex items-center gap-1.5 min-w-0">
              <i data-lucide="grip-horizontal" class="w-4 h-4 text-indigo-400 shrink-0"></i>
              <span class="text-[11px] font-bold text-white truncate">${escapeHtml(playerState.title)}</span>
            </div>
            <div class="flex items-center gap-1 shrink-0">
              <button type="button" onclick="window.expandMiniPopupToWatchPage()" class="p-1.5 rounded-lg bg-indigo-600 hover:bg-indigo-500 text-white">
                <i data-lucide="maximize-2" class="w-3.5 h-3.5"></i>
              </button>
              <button type="button" onclick="window.closeMiniPopupPlayer()" class="p-1.5 rounded-lg bg-rose-600/30 hover:bg-rose-600 text-rose-200 hover:text-white">
                <i data-lucide="x" class="w-3.5 h-3.5"></i>
              </button>
            </div>
          </div>

          <div class="relative w-full pt-[56.25%] bg-black overflow-hidden">
            <div id="media-embed-mount" class="absolute inset-0 w-full h-full"></div>
            <div id="player-click-shield" class="player-click-shield" oncontextmenu="return false;" onclick="window.handleScreenPointerTap(event)"></div>

    function bindMiniPopupDragEvents() {
      const handle = document.getElementById("mini-popup-drag-handle");
      const card = document.getElementById("mini-popup-card");
      if (!handle || !card) return;
      let dragging = false, startX = 0, startY = 0, startRight = playerState.miniPos.right, startBottom = playerState.miniPos.bottom;

      const onStart = (cx, cy) => {
        dragging = true; startX = cx; startY = cy; startRight = playerState.miniPos.right; startBottom = playerState.miniPos.bottom;
      };
      const onMove = (cx, cy) => {
        if (!dragging) return;
        const maxR = Math.max(8, window.innerWidth - card.offsetWidth - 8);
        const maxB = Math.max(8, window.innerHeight - card.offsetHeight - 8);
        playerState.miniPos.right = Math.max(8, Math.min(maxR, startRight + (startX - cx)));
        playerState.miniPos.bottom = Math.max(8, Math.min(maxB, startBottom + (startY - cy)));
        card.style.right = `${playerState.miniPos.right}px`;
        card.style.bottom = `${playerState.miniPos.bottom}px`;
      };
      handle.addEventListener("mousedown", (e) => { if (!e.target.closest("button")) onStart(e.clientX, e.clientY); });
      window.addEventListener("mousemove", (e) => onMove(e.clientX, e.clientY));
      window.addEventListener("mouseup", () => { dragging = false; });
      handle.addEventListener("touchstart", (e) => { if (!e.target.closest("button") && e.touches[0]) onStart(e.touches[0].clientX, e.touches[0].clientY); }, { passive: true });
      window.addEventListener("touchmove", (e) => { if (dragging && e.touches[0]) onMove(e.touches[0].clientX, e.touches[0].clientY); }, { passive: true });
      window.addEventListener("touchend", () => { dragging = false; });
    }

    function parseCsvRows(csvText) {
      const rows = [];
      let currentRow = [], currentVal = "", insideQuotes = false;
      for (let i = 0; i < csvText.length; i++) {
        const ch = csvText[i], nextCh = csvText[i + 1];
        if (ch === '"') {
          if (insideQuotes && nextCh === '"') { currentVal += '"'; i++; }
          else insideQuotes = !insideQuotes;
        } else if (ch === "," && !insideQuotes) {
          currentRow.push(currentVal.trim()); currentVal = "";
        } else if ((ch === "\n" || (ch === "\r" && nextCh === "\n")) && !insideQuotes) {
          if (ch === "\r") i++;
          currentRow.push(currentVal.trim());
          if (currentRow.some((c) => c !== "")) rows.push(currentRow);
          currentRow = []; currentVal = "";
        } else {
          currentVal += ch;
        }
      }
      if (currentVal !== "" || currentRow.length > 0) {
        currentRow.push(currentVal.trim());
        if (currentRow.some((c) => c !== "")) rows.push(currentRow);
      }
      return rows;
    }

    function mapTabularRowsToLectures(rawRows, idPrefix = "src") {
      if (!Array.isArray(rawRows) || rawRows.length === 0) return [];
      let videoCol = 0, titleCol = 1, folderCol = 2, pdfCol = 3, startIdx = 0;
      const firstRowLower = rawRows[0].map((c) => String(c || "").toLowerCase().trim());
      const hasHeader = firstRowLower.some((h) => h.includes("video") || h.includes("title") || h.includes("titel") || h.includes("folder") || h.includes("pdf"));
      if (hasHeader) {
        startIdx = 1;
        firstRowLower.forEach((h, idx) => {
          if (h.includes("video") || (h.includes("link") && !h.includes("pdf"))) videoCol = idx;
          else if (h.includes("title") || h.includes("titel") || h.includes("lecture")) titleCol = idx;
          else if (h.includes("folder") || h.includes("path") || h.includes("chapter")) folderCol = idx;
          else if (h.includes("pdf") || h.includes("note")) pdfCol = idx;
        });
      }
      const lessons = [];
      for (let i = startIdx; i < rawRows.length; i++) {
        const row = rawRows[i] || [];
        const videoUrl = String(row[videoCol] || "").trim();
        const title = String(row[titleCol] || "").trim();
        const folder = String(row[folderCol] || "").trim().replace(/^\/+|\/+$/g, "");
        const pdfLink = String(row[pdfCol] || "").trim();
        if (!videoUrl && !title) continue;
        lessons.push({
          id: `${idPrefix}_${Date.now()}_${i}`,
          videoUrl,
          title: title || `Lecture ${lessons.length + 1}`,
          folder: folder || "General",
          pdfLink
        });
      }
      return lessons;
    }

    async function syncFromGoogleSheet(sheetUrl, silent = false) {
      const sheetId = extractGoogleSheetId(sheetUrl);
      if (!sheetId) {
        if (!silent) showToast("সঠিক Google Sheet URL দিন!", "error");
        return;
      }
      state.isSyncing = true;
      if (!silent) render();
      try {
        const res = await fetch(`https://docs.google.com/spreadsheets/d/${encodeURIComponent(sheetId)}/gviz/tq?tqx=out:csv`, { cache: "no-store" });
        if (!res.ok) throw new Error("HTTP Error");
        const csvText = await res.text();
        const mapped = mapTabularRowsToLectures(parseCsvRows(csvText), "gsheet");
        if (mapped.length > 0) {
          state.lectures = mapped;
          state.dataSources.googleSheetUrl = sheetUrl;
          state.dataSources.lastSyncedAt = `Synced (${mapped.length} Classes)`;
          persistAll();
          if (!silent) showToast(`Google Sheet থেকে ${mapped.length}টি ক্লাস সিঙ্ক হয়েছে!`, "success");
        }
      } catch (err) {
        if (!silent) showToast("বর্তমান সংরক্ষিত ডাটা সক্রিয় রয়েছে।", "warning");
      } finally {
        state.isSyncing = false;
        render();
      }
    }

    async function importExcelFromUrl(excelUrl, mode = "replace") {
      if (!excelUrl) return;
      state.isSyncing = true;
      render();
      try {
        const res = await fetch(excelUrl, { cache: "no-store" });
        const wb = XLSX.read(await res.arrayBuffer(), { type: "array" });
        const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1 });
        const mapped = mapTabularRowsToLectures(rows, "xls_url");
        if (mapped.length === 0) throw new Error("Empty");
        state.lectures = mode === "merge" ? [...state.lectures, ...mapped] : mapped;
        state.dataSources.excelUrl = excelUrl;
        state.dataSources.lastSyncedAt = `Excel URL (${mapped.length} Classes)`;
        persistAll();
        showToast(`Excel URL থেকে ${mapped.length}টি ক্লাস লোড হয়েছে!`, "success");
      } catch (e) {
        showToast("Excel URL লোড করা যায়নি। লোকাল ফাইল আপলোড করুন।", "error");
      } finally {
        state.isSyncing = false;
        render();
      }
    }

    function importLocalExcelFile(file, mode = "replace") {
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (e) => {
        try {
          const wb = XLSX.read(new Uint8Array(e.target.result), { type: "array" });
          const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1 });
          const mapped = mapTabularRowsToLectures(rows, "xls_file");
          if (mapped.length === 0) { showToast("ফাইলে কোনো ডাটা পাওয়া যায়নি!", "error"); return; }
          state.lectures = mode === "merge" ? [...state.lectures, ...mapped] : mapped;
          state.dataSources.lastSyncedAt = `${file.name} (${mapped.length} Classes)`;
          persistAll();
          showToast(`"${file.name}" থেকে ${mapped.length}টি ক্লাস যুক্ত হয়েছে!`, "success");
          render();
        } catch (err) {
          showToast("Excel ফাইল পার্স করতে সমস্যা হয়েছে।", "error");
        }
      };
      reader.readAsArrayBuffer(file);
    }

    // 11. FOLDER TREE, PIN LOCKS & ADMIN RENAME/ICON ENGINE
    // =========================================================================
    function getAllFolderPaths() {
      const pathSet = new Set();
      state.lectures.forEach((lec) => {
        if (!lec.folder) return;
        const parts = lec.folder.split("/").map((p) => p.trim()).filter(Boolean);
        let acc = "";
        parts.forEach((part) => {
          acc = acc ? `${acc}/${part}` : part;
          pathSet.add(acc);
        });
      });
      Object.keys(state.folderLocks).forEach((fp) => { if (fp) pathSet.add(fp); });
      return Array.from(pathSet).sort((a, b) => a.localeCompare(b));
    }

    function getChildFolders(parentPath) {
      const allPaths = getAllFolderPaths();
      const children = new Set();
      const prefix = parentPath ? `${parentPath}/` : "";
      allPaths.forEach((fullPath) => {
        if (!parentPath) {
          const top = fullPath.split("/")[0];
          if (top) children.add(top);
        } else if (fullPath.startsWith(prefix)) {
          const nextSeg = fullPath.slice(prefix.length).split("/")[0];
          if (nextSeg) children.add(`${parentPath}/${nextSeg}`);
        }
      });
      return Array.from(children);
    }

    function countLecturesInTree(folderPath) {
      const prefix = `${folderPath}/`;
      return state.lectures.filter((l) => l.folder === folderPath || (l.folder && l.folder.startsWith(prefix))).length;
    }

    function findBlockingLock(targetPath) {
      if (!targetPath) return null;
      if (state.currentUser && state.currentUser.role === "admin") return null;
      const parts = targetPath.split("/").filter(Boolean);
      let acc = "";
      for (const part of parts) {
        acc = acc ? `${acc}/${part}` : part;
        const lockCfg = state.folderLocks[acc];
        if (lockCfg && lockCfg.locked && !state.unlockedFolders.has(acc)) {
          return { lockedPath: acc, pin: lockCfg.pin };
        }
      }
      return null;
    }

    function getFolderLockStatus(folderPath) {
      const parts = folderPath.split("/").filter(Boolean);
      let acc = "";
      for (const part of parts) {
        acc = acc ? `${acc}/${part}` : part;
        if (state.folderLocks[acc]?.locked) return { isLocked: true, ownerPath: acc };
      }
      return { isLocked: false, ownerPath: null };
    }

    function compressImageFileToDataUrl(file, maxDim = 220, callback) {
      const reader = new FileReader();
      reader.onload = (ev) => {
        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement("canvas");
          let w = img.width, h = img.height;
          if (w > h && w > maxDim) { h = Math.round((h * maxDim) / w); w = maxDim; }
          else if (h >= w && h > maxDim) { w = Math.round((w * maxDim) / h); h = maxDim; }
          canvas.width = w;
          canvas.height = h;
          canvas.getContext("2d").drawImage(img, 0, 0, w, h);
          callback(canvas.toDataURL("image/png", 0.9));
        };
        img.src = ev.target.result;
      };
      reader.readAsDataURL(file);
    }

    function handleUnifiedLogin(e) {
      e.preventDefault();
      const identifier = document.getElementById("unified-login-id").value.trim().toLowerCase();
      const password = document.getElementById("unified-login-pass").value;

      const adminEmailLower = (state.branding.adminEmail || ADMIN_PORTAL_EMAIL).toLowerCase();
      if (ADMIN_VALID_IDS.includes(identifier) || identifier === adminEmailLower) {
        if (password !== state.adminPassword) {
          showToast("পাসওয়ার্ড সঠিক নয়!", "error");
          return;
        }
        const savedAdminSession = loadJSON(STORAGE_KEYS.SESSION, null);
        state.currentUser = {
          id: "admin_master_root",
          role: "admin",
          status: "approved",
          email: state.branding.adminEmail || ADMIN_PORTAL_EMAIL,
          firstName: savedAdminSession?.firstName || state.branding.siteName,
          lastName: savedAdminSession?.lastName || "Admin",
          profile: savedAdminSession?.profile || createEmptyProfile(state.branding.siteName, "Admin", ADMIN_AVATAR)
        };
        state.activeView = "admin";
        persistAll();
        showToast(`${state.branding.siteName} Admin Dashboard-এ স্বাগতম!`, "success");
        render();
        return;
      }

      const foundUser = state.users.find(
        (u) => u.email.toLowerCase() === identifier || (u.username && u.username.toLowerCase() === identifier)
      );

      if (!foundUser) {
        showToast("এই ID বা Email দিয়ে কোনো অ্যাকাউন্ট পাওয়া যায়নি!", "error");
        return;
      }
      if (foundUser.method === "Google Account" && !foundUser.password) {
        showToast("Google অ্যাকাউন্ট দিয়ে সাইন-ইন করুন।", "warning");
        return;
      }
      if (foundUser.password !== password) {
        showToast("পাসওয়ার্ড সঠিক নয়!", "error");
        return;
      }

      state.currentUser = foundUser;
      state.activeView = "portal";
      persistAll();
      showToast(
        foundUser.status === "approved"
          ? `স্বাগতম ${foundUser.profile?.nickName || foundUser.firstName}!`
          : "আপনার অ্যাকাউন্টটি অ্যাডমিন অনুমোদনের অপেক্ষায় রয়েছে।",
        foundUser.status === "approved" ? "success" : "warning"
      );
      render();
    }

      if (!state.currentUser) return;
      const isAdmin = state.currentUser.role === "admin";

      const modalRoot = document.getElementById("modal-root");
      modalRoot.innerHTML = `

              ${

                  ? renderPasswordInputField({
                      id: "cp-current",
                      label: "বর্তমান পাসওয়ার্ড (Current Password) *",
                      required: true
                    })
                  : `<p class="text-xs text-theme-muted bg-indigo-500/10 p-3 rounded-xl">আপনার Google অ্যাকাউন্টের জন্য নতুন পাসওয়ার্ড সেট করুন যাতে Email/ID দিয়েও লগইন করতে পারেন।</p>`
              }
              ${renderPasswordInputField({
                id: "cp-new",
                label: "নতুন পাসওয়ার্ড (New Password) *",
                placeholder: "কমপক্ষে ৬ অক্ষর",
                required: true,
                minLength: 6
              })}
              ${renderPasswordInputField({
                id: "cp-confirm",
                label: "নতুন পাসওয়ার্ড নিশ্চিত করুন (Confirm) *",
                required: true,
                minLength: 6
              })}

              <div class="flex items-center justify-between pt-1">
                <button type="button" onclick="window.closeModal(); window.openForgotPasswordModal();" class="text-xs font-bold text-amber-500 hover:underline">
                  ${t("forgotPasswordLink")}
                </button>
              </div>

              <div class="flex justify-end gap-2.5 pt-2">
                <button type="button" onclick="window.closeModal()" class="px-4 py-2.5 rounded-xl border border-slate-400/40 text-theme-secondary text-xs font-bold">${t("cancel")}</button>
                <button type="submit" class="px-5 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-bold">${t("saveChanges")}</button>
              </div>
            </form>
          </div>
        </div>
      `;
      lucide.createIcons();

      document.getElementById("change-password-form").addEventListener("submit", (e) => {
        e.preventDefault();
        const newPass = document.getElementById("cp-new").value;
        const confirmPass = document.getElementById("cp-confirm").value;

        if (hasExistingPass) {
          const curPass = document.getElementById("cp-current").value;
          const actualPass = isAdmin ? state.adminPassword : state.currentUser.password;
          if (curPass !== actualPass) {
            showToast("বর্তমান পাসওয়ার্ডটি সঠিক নয়!", "error");
            return;
          }
        }
        if (newPass.length < 6) {
          showToast("নতুন পাসওয়ার্ড কমপক্ষে ৬ অক্ষরের হতে হবে!", "error");
          return;
        }
        if (newPass !== confirmPass) {
          showToast("নতুন পাসওয়ার্ড দুটি মিলছে না!", "error");
          return;
        }

        if (isAdmin) {
          state.adminPassword = newPass;
        } else {
          state.currentUser.password = newPass;
          const idx = state.users.findIndex((u) => u.id === state.currentUser.id);
          if (idx >= 0) state.users[idx].password = newPass;
        }

        persistAll();
        window.closeModal();
        showToast("পাসওয়ার্ড সফলভাবে পরিবর্তন করা হয়েছে!", "success");
      });
    }

      const defaultLucide = lockInfo.isLocked && !isUnlockedInSession ? "folder-lock" : "folder-open";

      return `

                  lockInfo.isLocked
