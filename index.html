    function renderAdminSourcesTab() {
      return `
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
          <div class="liquid-glass rounded-3xl p-6 space-y-4">
            <h3 class="text-base font-bold text-theme-primary">Google Sheet Data Source</h3>
            <input id="admin-gsheet-url" type="url" value="${escapeHtml(state.dataSources.googleSheetUrl)}" class="liquid-input w-full px-3.5 py-2.5 rounded-xl text-xs font-en" />
            <button onclick="window.syncAdminGoogleSheet()" class="w-full py-2.5 px-4 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold">
              Sync Google Sheet Now
            </button>
          </div>

          <div class="liquid-glass rounded-3xl p-6 space-y-4">
            <h3 class="text-base font-bold text-theme-primary">Excel (.xlsx / .xls / .csv) Upload / Link</h3>
            <label class="cursor-pointer flex items-center justify-center gap-2 py-3 px-4 rounded-2xl border-2 border-dashed border-indigo-400/50 hover:bg-indigo-500/10 text-xs font-bold text-theme-primary">
              <i data-lucide="file-spreadsheet" class="w-4 h-4 text-emerald-500"></i> Choose Excel/CSV File
              <input id="admin-excel-file" type="file" accept=".xlsx,.xls,.csv" class="hidden" />
            </label>
            <div class="flex gap-2">
              <input id="admin-excel-url" type="url" value="${escapeHtml(state.dataSources.excelUrl || "")}" placeholder="https://.../classes.xlsx" class="liquid-input flex-1 px-3.5 py-2 rounded-xl text-xs font-en" />
              <button onclick="window.loadAdminExcelUrl()" class="px-4 py-2 rounded-xl bg-indigo-600 text-white text-xs font-bold">Load</button>
            </div>
          </div>
        </div>
      `;
    }

    function renderAdminBrandingTab() {
      const b = state.branding;
      return `
        <div class="liquid-glass rounded-3xl p-6 max-w-2xl space-y-4">
          <h3 class="text-base font-bold text-theme-primary">ওয়েবসাইটের নাম ও লোগো সেটিংস</h3>
          <form id="admin-branding-form" class="space-y-4">
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
              <div>
                <label class="block text-xs font-semibold text-theme-secondary mb-1">Website Name</label>
                <input id="br-site-name" type="text" required value="${escapeHtml(b.siteName)}" class="liquid-input w-full px-3.5 py-2.5 rounded-xl text-sm font-bold" />
              </div>
              <div>
                <label class="block text-xs font-semibold text-theme-secondary mb-1">Logo Text</label>
                <input id="br-logo-text" type="text" maxlength="4" value="${escapeHtml(b.logoText || "iB")}" class="liquid-input w-full px-3.5 py-2.5 rounded-xl text-sm font-en font-bold" />
              </div>
            </div>
            <div>
              <label class="cursor-pointer inline-flex items-center gap-2 px-4 py-2.5 rounded-xl bg-indigo-600 text-white text-xs font-bold">
                <i data-lucide="upload" class="w-4 h-4"></i> Logo Image (.jpg, .png, .svg)
                <input id="br-logo-file" type="file" accept=".jpg,.jpeg,.png,.svg,image/*" class="hidden" />
              </label>
            </div>
            <button type="submit" class="px-6 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-bold">
              ${t("saveChanges")}
            </button>
          </form>
        </div>
      `;
    }

    // =========================================================================
    // 15. MAIN APPLICATION RENDERER & EVENT BINDINGS
    // =========================================================================
    function render() {
      applyThemeClasses();
      const appEl = document.getElementById("app");
      if (!appEl) return;

      if (!state.currentUser) {
        appEl.innerHTML = renderAuthScreen();
        lucide.createIcons();
        bindAuthEvents();
        return;
      }

      if (state.currentUser.role !== "admin" && state.currentUser.status === "pending") {
        appEl.innerHTML = renderPendingGateScreen();
        lucide.createIcons();
        return;
      }

      const u = state.currentUser;
      const isAdmin = u.role === "admin";
      const p = u.profile || createEmptyProfile(u.firstName, u.lastName);
      const pendingCount = state.users.filter((x) => x.status === "pending").length + state.passwordResets.filter((r) => r.status === "pending").length;
      const offlineCount = Object.keys(state.offlineMeta).length;

      let mainContent = "";
      if (state.activeView === "watch" && playerState.activeLectureId && !playerState.isMini) {
        mainContent = renderDedicatedWatchPage();
      } else if (state.activeView === "pdf") {
        mainContent = renderInAppPdfView();
      } else if (state.activeView === "offline") {
        mainContent = renderOfflineVaultView();
      } else if (state.activeView === "admin" && isAdmin) {
        mainContent = renderAdminDashboard();
      } else if (state.activeView === "profile") {
        mainContent = renderProfileView();
      } else {
        mainContent = renderPortalView();
      }

      appEl.innerHTML = `
        <header class="liquid-glass sticky top-0 z-30 border-b border-white/25">
          <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-3 flex items-center justify-between gap-3">
            <button onclick="window.switchMainView('portal')" class="flex items-center gap-2.5 text-left group">
              ${renderBrandLogoBadge("w-10 h-10 text-base")}
              <div>
                <span class="font-en font-extrabold text-lg sm:text-xl text-theme-primary tracking-tight block leading-none">${escapeHtml(state.branding.siteName)}</span>
                <span class="text-[10px] font-semibold text-theme-muted hidden sm:block mt-0.5">${escapeHtml(state.lang === "bn" ? state.branding.taglineBn : state.branding.taglineEn)}</span>
              </div>
            </button>

            <div class="flex items-center gap-1.5 sm:gap-2">
              <div class="hidden md:block mr-1">${renderFloatingPreferencesBar(true)}</div>

              <button onclick="window.switchMainView('portal')" class="inline-flex items-center gap-1.5 px-3 py-2 rounded-xl text-xs sm:text-sm font-bold transition ${state.activeView === "portal" || state.activeView === "watch" ? "bg-indigo-600 text-white shadow-sm" : "text-theme-secondary hover:bg-white/25"}">
                <i data-lucide="folder-open" class="w-4 h-4"></i>
                <span class="hidden sm:inline">${t("classFolders")}</span>
              </button>

              <button onclick="window.switchMainView('offline')" class="inline-flex items-center gap-1.5 px-3 py-2 rounded-xl text-xs sm:text-sm font-bold transition ${state.activeView === "offline" ? "bg-sky-600 text-white shadow-sm" : "text-theme-secondary hover:bg-white/25"}">
                <i data-lucide="hard-drive-download" class="w-4 h-4"></i>
                <span class="hidden sm:inline">${t("offlineModeTab")}</span>
                ${offlineCount > 0 ? `<span class="px-1.5 py-0.2 rounded-full bg-sky-500/20 text-sky-400 text-[10px] font-en font-extrabold">${offlineCount}</span>` : ""}
              </button>

              ${
                isAdmin
                  ? `<button onclick="window.switchMainView('admin')" class="relative inline-flex items-center gap-1.5 px-3 py-2 rounded-xl text-xs sm:text-sm font-bold transition ${state.activeView === "admin" ? "bg-indigo-600 text-white shadow-sm" : "text-theme-secondary hover:bg-white/25"}">
                      <i data-lucide="shield-check" class="w-4 h-4"></i>
                      <span class="hidden sm:inline">${t("adminTab")}</span>
                      ${pendingCount > 0 ? `<span class="px-1.5 py-0.2 rounded-full bg-amber-500 text-slate-950 text-[10px] font-en font-extrabold">${pendingCount}</span>` : ""}
                    </button>`
                  : ""
              }

              <button onclick="window.switchMainView('profile')" class="inline-flex items-center gap-2 pl-1.5 pr-3 py-1 rounded-xl border transition ${state.activeView === "profile" ? "bg-indigo-600 text-white border-indigo-500" : "bg-white/20 border-white/30 text-theme-primary hover:bg-white/35"}">
                <img src="${escapeHtml(p.profilePicture || DEFAULT_AVATAR)}" onerror="this.src='${DEFAULT_AVATAR}'" class="w-7 h-7 rounded-lg object-cover bg-white" />
                <span class="text-xs sm:text-sm font-bold max-w-[90px] truncate">${escapeHtml(p.nickName || p.firstName || "Profile")}</span>
              </button>

              <button onclick="window.handleLogout()" title="${t("logout")}" class="p-2 rounded-xl text-theme-secondary hover:text-rose-500 hover:bg-rose-500/10 transition">
                <i data-lucide="log-out" class="w-4 h-4 sm:w-5 sm:h-5"></i>
              </button>
            </div>
          </div>

          <div class="md:hidden px-4 pb-2.5 flex items-center justify-between border-t border-white/15 pt-2">
            ${renderFloatingPreferencesBar(true)}
          </div>
        </header>

        <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6">
          ${mainContent}
        </main>
      `;

      lucide.createIcons();
      bindDynamicViewEvents();
    }

    function bindAuthEvents() {
      const loginForm = document.getElementById("unified-login-form");
      if (loginForm) loginForm.addEventListener("submit", handleUnifiedLogin);

      const regForm = document.getElementById("user-register-form");
      if (regForm) regForm.addEventListener("submit", handleEmailRegistration);
    }

    function bindDynamicViewEvents() {
      const createUserForm = document.getElementById("admin-create-user-form");
      if (createUserForm) {
        createUserForm.addEventListener("submit", (e) => {
          e.preventDefault();
          const firstName = document.getElementById("adm-new-fname").value.trim();
          const lastName = document.getElementById("adm-new-lname").value.trim();
          const email = document.getElementById("adm-new-email").value.trim();
          const password = document.getElementById("adm-new-pass").value;

          const norm = email.toLowerCase();
          if (ADMIN_VALID_IDS.includes(norm) || state.users.some((u) => u.email.toLowerCase() === norm)) {
            showToast("এই ID বা Email ইতিমধ্যে রয়েছে!", "error");
            return;
          }

          state.users.unshift({
            id: `usr_${Date.now()}`,
            role: "user",
            status: "approved",
            method: "Admin Created",
            firstName,
            lastName,
            email,
            username: email,
            password,
            requestedAt: new Date().toLocaleString("bn-BD", { dateStyle: "medium", timeStyle: "short" }),
            approvedAt: new Date().toLocaleString("bn-BD", { dateStyle: "medium", timeStyle: "short" }),
            profile: createEmptyProfile(firstName, lastName, DEFAULT_AVATAR)
          });
          persistAll();
          showToast("নতুন ইউজার অ্যাকাউন্ট তৈরি হয়েছে!", "success");
          render();
        });
      }

      const excelFileInput = document.getElementById("admin-excel-file");
      if (excelFileInput) {
        excelFileInput.addEventListener("change", (e) => {
          if (e.target.files?.[0]) importLocalExcelFile(e.target.files[0], "replace");
        });
      }

      let pendingLogoDataUrl = state.branding.logoImage || "";
      const brLogoFile = document.getElementById("br-logo-file");
      if (brLogoFile) {
        brLogoFile.addEventListener("change", (e) => {
          const f = e.target.files?.[0];
          if (!f) return;
          compressImageFileToDataUrl(f, 160, (dataUrl) => {
            pendingLogoDataUrl = dataUrl;
            showToast("Logo Image লোড হয়েছে!", "info");
          });
        });
      }

      const brForm = document.getElementById("admin-branding-form");
      if (brForm) {
        brForm.addEventListener("submit", (e) => {
          e.preventDefault();
          const siteName = document.getElementById("br-site-name").value.trim() || "iBoster";
          const logoText = document.getElementById("br-logo-text").value.trim() || "iB";
          state.branding.siteName = siteName;
          state.branding.logoText = logoText;
          if (pendingLogoDataUrl) {
            state.branding.logoType = "image";
            state.branding.logoImage = pendingLogoDataUrl;
          } else {
            state.branding.logoType = "text";
          }
          persistAll();
          showToast("ওয়েবসাইটের নাম ও লোগো আপডেট হয়েছে!", "success");
          render();
        });
      }
    }

    // =========================================================================
    // 16. GLOBAL WINDOW HANDLERS & INITIALIZATION
    // =========================================================================
    window.switchAuthTab = (tab) => { state.authTab = tab; render(); };
    window.openGoogleModal = () => openGoogleApprovalModal();
    window.openForgotPasswordModal = () => openForgotPasswordPortalModal();
    window.openChangePasswordModal = () => openChangePasswordModal();
    window.openProfileEditModal = () => openProfileEditModal();
    window.closeModal = () => { const mr = document.getElementById("modal-root"); if (mr) mr.innerHTML = ""; };

    window.handleLogout = () => {
      destroyActivePlayer();
      state.currentUser = null;
      state.activeView = "portal";
      state.currentPath = "";
      state.offlinePath = "";
      state.unlockedFolders.clear();
      persistAll();
      render();
    };

    window.refreshApprovalStatus = () => {
      if (!state.currentUser) return;
      const fresh = state.users.find((u) => u.id === state.currentUser.id);
      if (fresh) {
        state.currentUser = fresh;
        persistAll();
        if (fresh.status === "approved") { showToast("আপনার অ্যাকাউন্ট Approved হয়েছে!", "success"); render(); }
        else showToast("এখনও Pending অবস্থায় রয়েছে।", "info");
      }
    };

    window.switchMainView = (viewName) => {
      if (playerState.activeLectureId && !playerState.isMini && viewName !== "watch") {
        window.enterMiniPopupView();
        return;
      }
      state.activeView = viewName;
      render();
    };

    window.openFolder = (targetPath) => {
      if (!targetPath) { state.currentPath = ""; render(); return; }
      const blocking = findBlockingLock(targetPath);
      if (blocking) {
        openPinVerificationModal(blocking.lockedPath, blocking.pin, () => { state.currentPath = targetPath; render(); });
        return;
      }
      state.currentPath = targetPath;
      render();
    };

    window.goUpFolder = () => {
      if (!state.currentPath) return;
      const parts = state.currentPath.split("/").filter(Boolean);
      parts.pop();
      state.currentPath = parts.join("/");
      render();
    };

    window.openOfflineFolder = (targetPath) => {
      state.offlinePath = targetPath || "";
      render();
    };

    window.handlePortalSearch = (val) => { state.searchQuery = val; render(); };
    window.handleOfflineSearch = (val) => { state.offlineSearchQuery = val; render(); };
    window.clearSearch = () => { state.searchQuery = ""; render(); };

    window.openWatchLecture = (lectureId, fromOfflineVault = false) => openLectureOnWatchPage(lectureId, null, fromOfflineVault);
    window.backToFolderFromWatch = (folderPath, isOffline) => {
      destroyActivePlayer();
      if (isOffline) {
        state.offlinePath = folderPath || "";
        state.activeView = "offline";
      } else {
        state.currentPath = folderPath || "";
        state.activeView = "portal";
      }
      render();
    };

    window.saveLectureOffline = (lectureId) => downloadLectureForOffline(lectureId);
    window.deleteOfflineItem = (lectureId) => deleteOfflineLecture(lectureId);

    window.setAdminTab = (tab) => { state.activeAdminTab = tab; render(); };
    window.previewAdminUser = (uid) => openAdminUserPreviewModal(uid);
    window.openAdminResetModal = (resetId) => openAdminResetAndSendModal(resetId);
    window.deletePasswordResetItem = (resetId) => {
      state.passwordResets = state.passwordResets.filter((r) => r.id !== resetId);
      persistAll();
      render();
    };

    window.approveUserRequest = (uid) => {
      const u = state.users.find((x) => x.id === uid);
      if (u) {
        u.status = "approved";
        u.approvedAt = new Date().toLocaleString("bn-BD", { dateStyle: "medium", timeStyle: "short" });
        persistAll();
        showToast(`${u.firstName} Approved!`, "success");
        render();
      }
    };

    window.rejectUserRequest = (uid) => {
      state.users = state.users.filter((x) => x.id !== uid);
      persistAll();
      showToast("Request rejected.", "info");
      render();
    };

    window.deleteApprovedUser = (uid) => {
      state.users = state.users.filter((x) => x.id !== uid);
      persistAll();
      showToast("User account removed.", "info");
      render();
    };

    window.saveFolderLockConfig = (fp, nextLockedState) => {
      const inp = document.getElementById(`pin-cfg-${fp}`);
      const pinVal = (inp ? inp.value : state.folderLocks[fp]?.pin || "1234").trim();
      if (nextLockedState && !pinVal) { showToast("PIN দিন!", "error"); return; }
      state.folderLocks[fp] = { locked: nextLockedState, pin: pinVal };
      if (!nextLockedState) state.unlockedFolders.delete(fp);
      persistAll();
      showToast(`${fp} ${nextLockedState ? "Locked" : "Unlocked"}`, "success");
      render();
    };

    window.openFolderEditModal = (fp) => openFolderRenameAndIconModal(fp);
    window.openNewLessonModal = () => openLessonEditorModal(null);
    window.openEditLessonModal = (lecId) => {
      const lec = state.lectures.find((l) => l.id === lecId);
      if (lec) openLessonEditorModal(lec);
    };
    window.deleteAdminLecture = (lecId) => {
      state.lectures = state.lectures.filter((l) => l.id !== lecId);
      persistAll();
      showToast("Lecture deleted.", "info");
      render();
    };

    window.syncAdminGoogleSheet = () => {
      const url = document.getElementById("admin-gsheet-url")?.value.trim() || state.dataSources.googleSheetUrl;
      syncFromGoogleSheet(url, false);
    };

    window.loadAdminExcelUrl = () => {
      const url = document.getElementById("admin-excel-url")?.value.trim();
      if (url) importExcelFromUrl(url, "replace");
    };

    window.addEventListener("DOMContentLoaded", () => {
      render();
      if (state.themeMode === "weather") fetchLiveWeatherAndAdapt(true);
      if (state.dataSources.googleSheetUrl) syncFromGoogleSheet(state.dataSources.googleSheetUrl, true);
    });
  </script>
</body>
</html>
